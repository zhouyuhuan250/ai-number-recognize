<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>印刷体数字识别（离线）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0b1220; color: #e8eefc; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 10px 14px 8px; background: #101a2e; border-bottom: 1px solid #1d2b47; }
  #status { font-size: 13px; color: #9fb4d8; min-height: 18px; }
  #barWrap { height: 4px; background: #1d2b47; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #38bdf8; transition: width .2s; }

  #stage { position: relative; flex: 1; background: #000; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* 取景框：调整 left/top/width/height 即可改变识别区域 */
  #cropBox {
    position: absolute; left: 5%; top: 40%; width: 90%; height: 22%;
    border: 2px solid rgba(56,189,248,.95); border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(3,7,18,.5); pointer-events: none;
  }
  .scanline {
    position: absolute; left: 4px; right: 4px; top: 2px; height: 2px; border-radius: 1px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent); opacity: 0;
  }
  body.scanning .scanline { opacity: 1; animation: scan 2s linear infinite; }
  @keyframes scan { 0% { top: 2px; } 50% { top: calc(100% - 4px); } 100% { top: 2px; } }

  #liveText {
    position: absolute; top: 10px; left: 12px; right: 12px; text-align: center;
    font-size: 20px; font-weight: 600; letter-spacing: 1px; color: #7dd3fc;
    text-shadow: 0 1px 6px rgba(0,0,0,.9); word-break: break-all;
    min-height: 26px; pointer-events: none;
  }
  #liveText.ok { color: #4ade80; }
  #liveText.dim { color: #64748b; font-weight: 400; font-size: 14px; }

  #controls { display: flex; gap: 10px; padding: 12px; background: #101a2e; }
  button {
    flex: 1; min-height: 46px; border: 1px solid #274066; border-radius: 12px;
    background: #16233c; color: #dbe7fb; font-size: 15px;
  }
  button.primary { background: #0e7490; border-color: #22a5c9; color: #fff; font-weight: 600; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }

  #resultArea { padding: 10px 14px calc(14px + env(safe-area-inset-bottom)); background: #101a2e; border-top: 1px solid #1d2b47; }
  .rowLabel { font-size: 12px; color: #7f93b8; margin-bottom: 6px; display: flex; justify-content: space-between; }
  #result {
    width: 100%; height: 46px; border-radius: 10px; border: 1px solid #274066;
    background: #0b1526; color: #fff; font-size: 20px; letter-spacing: 2px;
    font-family: ui-monospace, Menlo, Consolas, monospace; padding: 0 12px; outline: none;
  }
  #result.flash { border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.25); }
  .rowBtns { display: flex; gap: 10px; margin-top: 10px; }
  .rowBtns button { min-height: 40px; font-size: 14px; }
  #note { font-size: 11px; color: #586a8c; margin-top: 8px; text-align: center; }

  #toast {
    position: fixed; left: 50%; bottom: 30%; transform: translateX(-50%) translateY(10px);
    background: rgba(15,23,42,.95); border: 1px solid #274066; color: #e8eefc;
    padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: all .25s; pointer-events: none; z-index: 99; max-width: 80vw; word-break: break-all;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div id="status">点击「启动相机并识别」开始（首次会下载离线引擎）</div>
  <div id="barWrap"><div id="bar"></div></div>
</header>

<div id="stage">
  <video id="video" playsinline webkit-playsinline muted autoplay></video>
  <div id="cropBox"><div class="scanline"></div></div>
  <div id="liveText"></div>
</div>

<div id="controls">
  <button id="btnStart" class="primary">启动相机并识别</button>
  <button id="btnShot">单帧识别</button>
  <button id="btnTorch" style="display:none">闪光灯</button>
</div>

<section id="resultArea">
  <div class="rowLabel"><span>识别结果（可手动修正）</span><span id="len"></span></div>
  <input id="result" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"
         placeholder="识别到的 8~20 位数字显示在这里">
  <div class="rowBtns">
    <button id="btnCopy">复制结果</button>
    <button id="btnClear">清空</button>
  </div>
  <div id="note">所有识别均在手机本地完成，不上传任何数据 · 首次打开需联网，之后可离线使用</div>
</section>

<div id="toast"></div>
<script src="https://fastly.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const video = $('video'), cropBox = $('cropBox'), liveText = $('liveText');
  const resultEl = $('result'), statusEl = $('status'), bar = $('bar'), lenEl = $('len');
  const btnStart = $('btnStart'), btnShot = $('btnShot'), btnTorch = $('btnTorch');

  /* ================= 可调参数 ================= */
  const MIN_LEN = 8, MAX_LEN = 20;   // 目标数字位数范围
  const PSM = '6';                   // 6=按块识别(可跨行拼接) 7=单行
  const STABLE_FRAMES = 3;           // 连续 N 帧一致才确认写入
  const FRAME_INTERVAL = 150;        // 帧分析间隔(ms)
  const SCALE_MULT = 2, MAX_W = 1200, MIN_W = 480; // 识别目标宽度控制
  /* =========================================== */

  let stream = null, worker = null;
  let running = false, looping = false, busyInit = false;
  let cand = '', candCount = 0, confirmed = '';
  let torchOn = false;
  const cropCanvas = document.createElement('canvas');

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const status = t => statusEl.textContent = t;
  let toastTimer = null;
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }
  function handleError(e) {
    const n = (e && e.name) || '';
    if (n === 'NotAllowedError' || n === 'SecurityError')
      status('相机权限被拒绝：请在浏览器设置中允许本页面使用摄像头');
    else if (n === 'NotFoundError' || n === 'OverconstrainedError')
      status('未找到可用的摄像头');
    else if (n === 'NotReadableError')
      status('摄像头被占用，请关闭其他使用相机的应用');
    else status('出错了：' + ((e && e.message) || e));
  }

  /* ---------- Service Worker（离线缓存） ---------- */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  if (!window.isSecureContext) {
    status('⚠ 当前非 HTTPS 页面，浏览器将禁止调用摄像头，请用 https 地址打开');
  }

  /* ---------- 数字提取与清洗 ---------- */
  const CONFUSABLE = { O:'0', o:'0', D:'0', Q:'0', I:'1', i:'1', l:'1', L:'1', J:'1', '|':'1', '!':'1',
                       B:'8', S:'5', s:'5', Z:'2', z:'2', G:'6', b:'6', T:'7', g:'9', q:'9', A:'4' };
  function extractDigits(raw) {
    const s = (raw || '').replace(/[\s\u00A0\u200B]/g, '');
    const re = new RegExp(`\\d{${MIN_LEN},${MAX_LEN}}`, 'g');
    const best = m => (m && m.length) ? m.reduce((a, b) => b.length > a.length ? b : a) : '';
    let hit = best(s.match(re));                                            // ① 直接命中
    if (hit) return hit;
    hit = best(s.replace(/[-–—.·'’]/g, '').match(re));                      // ② 去掉分隔符(1234-5678-9012)
    if (hit) return hit;
    const mapped = s.replace(/[A-Za-z|!]/g, c => CONFUSABLE[c] != null ? CONFUSABLE[c] : '')
                   .replace(/[^0-9]/g, '');                                 // ③ 误读兜底 O→0、l→1、B→8…
    return best(mapped.match(re));
  }

  /* ---------- 初始化识别引擎 ---------- */
  const STATUS_CN = {
    'loading tesseract core': '加载识别核心',
    'initializing tesseract': '初始化引擎',
    'initializing api': '初始化接口',
    'loading language traineddata': '下载识别模型'
  };
  async function initWorker() {
    if (worker) return worker;
    if (busyInit) throw new Error('正在初始化');
    if (typeof Tesseract === 'undefined') {
      status('识别引擎脚本加载失败：请检查网络（或按说明自托管脚本）');
      throw new Error('engine script load failed');
    }
    busyInit = true; btnStart.disabled = true;
    try {
      status('正在加载离线识别引擎（首次约 5~8MB，之后走本地缓存）…');
      worker = await Tesseract.createWorker('eng', 1, {
        langPath: 'https://tessdata.projectnaptha.com/4.0.0_fast', // 要更准可改 4.0.0(标准)或 4.0.0_best，体积更大
        logger: m => {
          if (m.status === 'recognizing text') return;
          const label = STATUS_CN[m.status] || m.status;
          if (typeof m.progress === 'number') {
            bar.style.width = Math.round(m.progress * 100) + '%';
            status(label + ' ' + Math.round(m.progress * 100) + '%');
          }
        }
      });
      await worker.setParameters({
        tessedit_char_whitelist: '0123456789',
        tessedit_pageseg_mode: PSM,
        preserve_interword_spaces: '0'
      });
      bar.style.width = '100%';
      setTimeout(() => bar.style.width = '0', 600);
      status('引擎就绪 · 全部在本地识别');
      return worker;
    } catch (err) {
      status('引擎加载失败：首次使用需联网下载模型，请联网后重试');
      throw err;
    } finally {
      busyInit = false; btnStart.disabled = false;
    }
  }

  /* ---------- 摄像头 ---------- */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw Object.assign(new Error('当前浏览器不支持摄像头调用（需 HTTPS + 现代浏览器）'), { name: 'SecurityError' });
    }
    status('请求摄像头权限…');
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },   // 优先后置摄像头
        width: { ideal: 1920 }, height: { ideal: 1080 }
      }
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    btnTorch.style.display = caps.torch ? '' : 'none';  // 不支持闪光灯则隐藏
    status('相机已就绪');
  }

  /* ---------- 取景框裁剪（object-fit:cover 坐标换算） ---------- */
  function grabFrame(mult, cv) {
    mult = mult || 1;
    cv = cv || cropCanvas;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const box = cropBox.getBoundingClientRect();
    const vr = video.getBoundingClientRect();
    if (!vr.width || !vr.height) return null;
    const cover = Math.max(vr.width / vw, vr.height / vh);
    const offX = (vw * cover - vr.width) / 2;
    const offY = (vh * cover - vr.height) / 2;
    let sx = (box.left - vr.left + offX) / cover;
    let sy = (box.top - vr.top + offY) / cover;
    let sw = box.width / cover, sh = box.height / cover;
    sx = Math.max(0, Math.min(vw - 1, sx));
    sy = Math.max(0, Math.min(vh - 1, sy));
    sw = Math.max(8, Math.min(vw - sx, sw));
    sh = Math.max(8, Math.min(vh - sy, sh));
    let tw = Math.round(sw * SCALE_MULT * mult);
    tw = Math.max(MIN_W, Math.min(MAX_W, tw));   // 放大有助于小字识别
    const k = tw / sw;
    cv.width = tw;
    cv.height = Math.max(24, Math.round(sh * k));
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    return cv;
  }

  /* ---------- 结果处理（含稳定性确认） ---------- */
  function handleText(text) {
    const digits = extractDigits(text);
    if (!digits) {
      const partial = ((text || '').match(/\d+/g) || []).join('');
      liveText.className = 'dim';
      liveText.textContent = (partial && partial.length >= 4)
        ? '已看到 ' + partial.length + ' 位：' + partial
        : '对准印刷体数字（8~20 位）…';
      cand = ''; candCount = 0;
      return;
    }
    liveText.className = '';
    liveText.textContent = digits;
    if (digits === cand) candCount++; else { cand = digits; candCount = 1; }
    if (candCount >= STABLE_FRAMES && digits !== confirmed) {
      confirmed = digits;
      resultEl.value = digits;
      updateLen();
      resultEl.classList.add('flash');
      setTimeout(() => resultEl.classList.remove('flash'), 500);
      if (navigator.vibrate) navigator.vibrate(80);
      liveText.className = 'ok';
      /* 供后续业务调用：页面任何位置监听该事件即可拿到结果 */
      document.dispatchEvent(new CustomEvent('digits-confirmed', { detail: digits }));
    }
  }

  /* ---------- 实时扫描循环 ---------- */
  async function loop() {
    if (looping) return;
    looping = true;
    while (running) {
      const c = grabFrame();
      if (c && worker) {
        try {
          const { data } = await worker.recognize(c);
          handleText(data.text);
        } catch (e) { /* 忽略单帧异常 */ }
      }
      await sleep(FRAME_INTERVAL);
    }
    looping = false;
  }
  function startScan() {
    running = true;
    document.body.classList.add('scanning');
    btnStart.textContent = '停止扫描';
    loop();
  }
  function stopScan() {
    running = false;
    document.body.classList.remove('scanning');
    btnStart.textContent = '开始扫描';
    liveText.textContent = '';
  }

  /* ---------- 按钮事件 ---------- */
  btnStart.addEventListener('click', async () => {
    if (running) { stopScan(); return; }
    btnStart.disabled = true;
    try {
      if (!stream) await startCamera();
      await initWorker();
      startScan();
    } catch (e) {
      if (!/engine|tesseract/i.test(String(e && e.message))) handleError(e);
    } finally {
      btnStart.disabled = false;
    }
  });

  btnShot.addEventListener('click', async () => {
    try {
      if (!stream) { toast('请先启动相机'); return; }
      if (!worker) await initWorker();
      btnShot.disabled = true;
      status('正在识别…');
      const shotCanvas = document.createElement('canvas');
      const c = grabFrame(2, shotCanvas);          // 单帧用更高分辨率
      if (!c) { toast('取景失败'); return; }
      const { data } = await worker.recognize(c);
      const digits = extractDigits(data.text);
      if (digits) {
        confirmed = digits; cand = digits; candCount = STABLE_FRAMES;
        resultEl.value = digits; updateLen();
        resultEl.classList.add('flash');
        setTimeout(() => resultEl.classList.remove('flash'), 500);
        if (navigator.vibrate) navigator.vibrate(80);
        document.dispatchEvent(new CustomEvent('digits-confirmed', { detail: digits }));
        toast('识别成功');
      } else {
        toast('未识别到 8~20 位数字，请靠近并对准');
      }
      status('引擎就绪 · 全部在本地识别');
    } catch (e) {
      if (!/engine|tesseract/i.test(String(e && e.message))) handleError(e);
    } finally {
      btnShot.disabled = false;
    }
  });

  btnTorch.addEventListener('click', async () => {
    try {
      const track = stream && stream.getVideoTracks()[0];
      if (!track) return;
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      btnTorch.textContent = torchOn ? '关闭闪光' : '闪光灯';
    } catch (e) { toast('此设备不支持闪光灯'); }
  });

  $('btnCopy').addEventListener('click', async () => {
    const t = resultEl.value.trim();
    if (!t) { toast('暂无结果'); return; }
    try {
      await navigator.clipboard.writeText(t);
      toast('已复制：' + t);
    } catch (e) {
      resultEl.select();
      document.execCommand('copy');
      toast('已复制');
    }
  });

  $('btnClear').addEventListener('click', () => {
    resultEl.value = ''; confirmed = ''; cand = ''; candCount = 0;
    updateLen();
  });

  function updateLen() {
    const n = resultEl.value.replace(/\D/g, '').length;
    lenEl.textContent = n ? n + ' 位' : '';
  }
  resultEl.addEventListener('input', updateLen);

  /* 切后台自动暂停，回前台点「开始扫描」继续 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) {
      running = false;
      document.body.classList.remove('scanning');
      btnStart.textContent = '开始扫描';
    }
  });
})();
</script>
